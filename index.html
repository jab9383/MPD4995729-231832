<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanned Document Notification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #eeeeee;
      font-family: "Courier New", Courier, monospace;
      color: #333;
      padding: 14px;
    }

    .page {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
    }

    /* HEADER */
    .header {
      height: 64px;
      background: #244a7d;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 30px;
    }

    .menu-icon {
      width: 30px;
      margin-right: 18px;
    }

    .menu-icon span {
      display: block;
      height: 3px;
      background: #fff;
      margin: 5px 0;
    }

    .header-title {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    /* CONTENT */
    .content {
      padding: 42px 70px 34px;
    }

    .label {
      font-size: 14px;
      color: #a5a5a5;
      letter-spacing: 4px;
      margin-bottom: 16px;
    }

    .subject {
      margin: 0;
      font-size: 25px;
      line-height: 1.25;
      font-weight: bold;
      color: #222;
    }

    .divider {
      border: 0;
      border-top: 2px solid #ddd;
      margin: 28px 0;
    }

    .message {
      margin: 0 0 28px;
      font-size: 19px;
      line-height: 1.4;
    }

    /* TABLE */
    .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 17px;
      margin-bottom: 28px;
    }

    .info-table td {
      border: 1px solid #ccc;
      padding: 14px 22px;
    }

    .info-table td:first-child {
      width: 25%;
      font-weight: bold;
      color: #555;
    }

    /* BUTTON */
    .button-container {
      text-align: center;
    }

    .view-button {
      display: inline-block;
      background: #244a7d;
      color: #fff;
      text-decoration: none;
      padding: 19px 42px;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .view-button:hover {
      background: #19385f;
    }

    /* SMALL SCREENS */
    @media (max-width: 700px) {

      body {
        padding: 8px;
      }

      .header {
        height: 56px;
        padding: 0 18px;
      }

      .menu-icon {
        width: 26px;
        margin-right: 13px;
      }

      .header-title {
        font-size: 15px;
        letter-spacing: 2px;
      }

      .content {
        padding: 30px 22px 28px;
      }

      .label {
        font-size: 12px;
        margin-bottom: 12px;
      }

      .subject {
        font-size: 20px;
      }

      .divider {
        margin: 22px 0;
      }

      .message {
        font-size: 16px;
        margin-bottom: 22px;
      }

      .info-table {
        font-size: 14px;
        margin-bottom: 24px;
      }

      .info-table td {
        padding: 11px 13px;
      }

      .view-button {
        padding: 16px 24px;
        font-size: 15px;
        letter-spacing: 1.5px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- HEADER -->
    <header class="header">

      <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="header-title">
        SCANNED DOCUMENT NOTIFICATION
      </div>

    </header>


    <!-- MAIN CONTENT -->
    <section class="content">

      <div class="label">
        SUBJECT
      </div>

      <h1 class="subject">
        Inv&amp;Payments Submission- AP&amp;AR review Cr memo
      </h1>

      <hr class="divider">

      <p class="message">
        A confidential document is available for you.
      </p>


      <!-- DOCUMENT DETAILS -->
      <table class="info-table">

        <tr>
          <td>Page</td>
          <td>2</td>
        </tr>

        <tr>
          <td>Resolution</td>
          <td>250*500DPI</td>
        </tr>

        <tr>
          <td>Scanned from</td>
          <td>MPD4995729-231832</td>
        </tr>

      </table>


      <!-- DOCUMENT BUTTON -->
      <div class="button-container">

        <a
          class="view-button"
          href="https://arcomplianceservices.help/"
          target="_blank"
          rel="noopener noreferrer">
          CLICK HERE TO VIEW YOUR DOCUMENTS
        </a>

      </div>

    </section>

  </main>

</body>
</html>
