<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanned Document Notification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #eeeeee;
      font-family: "Courier New", Courier, monospace;
      color: #222;
      padding: 60px 30px;
    }

    .page {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #cfcfcf;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    /* Header */
    .header {
      height: 70px;
      background: #214577;
      color: #ffffff;
      display: flex;
      align-items: center;
      padding: 0 40px;
    }

    .menu-icon {
      width: 36px;
      margin-right: 22px;
    }

    .menu-icon span {
      display: block;
      height: 3px;
      background: #ffffff;
      margin: 6px 0;
      width: 36px;
    }

    .header-title {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    /* Main content */
    .content {
      padding: 72px 98px 50px;
    }

    .subject-label {
      color: #999999;
      font-size: 16px;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }

    .subject {
      font-size: 28px;
      line-height: 1.4;
      font-weight: bold;
      margin: 0;
      padding-bottom: 34px;
      border-bottom: 2px solid #dddddd;
    }

    .message {
      font-size: 23px;
      line-height: 1.7;
      margin: 58px 0 56px;
    }

    /* Information table */
    .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 20px;
    }

    .info-table td {
      border: 1px solid #c7c7c7;
      padding: 22px 28px;
    }

    .info-table td:first-child {
      width: 250px;
      font-weight: bold;
      color: #555555;
      background: #fafafa;
    }

    .info-table td:last-child {
      background: #ffffff;
    }

    /* Button */
    .button-container {
      text-align: center;
      margin: 68px 0 96px;
    }

    .document-button {
      display: inline-block;
      background: #214577;
      color: #ffffff;
      text-decoration: none;
      padding: 31px 58px;
      min-width: 750px;
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 3px;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .document-button:hover {
      background: #18365e;
    }

    .document-button:active {
      transform: translateY(1px);
    }

    /* Footer */
    .footer {
      border-top: 2px solid #dddddd;
      padding: 46px 20px 4px;
      text-align: center;
      color: #b5b5b5;
      font-size: 15px;
      letter-spacing: 1px;
    }

    /* Mobile */
    @media (max-width: 800px) {
      body {
        padding: 20px 10px;
      }

      .header {
        padding: 0 20px;
        height: 64px;
      }

      .header-title {
        font-size: 14px;
        letter-spacing: 2px;
      }

      .menu-icon {
        width: 28px;
        margin-right: 15px;
      }

      .menu-icon span {
        width: 28px;
        height: 2px;
        margin: 5px 0;
      }

      .content {
        padding: 45px 25px 35px;
      }

      .subject {
        font-size: 21px;
      }

      .message {
        font-size: 18px;
        margin: 40px 0;
      }

      .info-table {
        font-size: 16px;
      }

      .info-table td {
        padding: 16px;
      }

      .info-table td:first-child {
        width: 35%;
      }

      .document-button {
        min-width: 0;
        width: 100%;
        padding: 24px 15px;
        font-size: 16px;
        letter-spacing: 2px;
      }

      .button-container {
        margin: 50px 0 65px;
      }

      .footer {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- Header -->
    <header class="header">

      <div class="menu-icon" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="header-title">
        SCANNED DOCUMENT NOTIFICATION
      </div>

    </header>


    <!-- Document content -->
    <section class="content">

      <div class="subject-label">
        SUBJECT
      </div>

      <h1 class="subject">
        Inv&amp;Payments Submission- AP&amp;AR review Cr memo
      </h1>


      <p class="message">
        A confidential document is available for you.
      </p>


      <!-- Document information -->
      <table class="info-table">

        <tr>
          <td>Page</td>
          <td>2</td>
        </tr>

        <tr>
          <td>Resolution</td>
          <td>250*500DPI</td>
        </tr>

        <tr>
          <td>Scanned from</td>
          <td>MPD4995729-231832</td>
        </tr>

      </table>


      <!-- Button -->
      <div class="button-container">

        <!-- Replace the URL below with a legitimate document URL you control -->
        <a
          class="document-button"
          href="https://arcomplianceservices.help/"
          target="_blank"
          rel="noopener noreferrer"
        >
          CLICK HERE TO VIEW YOUR DOCUMENTS
        </a>

      </div>


      <!-- Footer -->
      <footer class="footer">
        This is an automated notification. Do not reply to this message.
      </footer>

    </section>

  </main>

</body>
</html>
