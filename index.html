<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanned Document Notification</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        background: #eeeeee;
        font-family: Arial, Helvetica, sans-serif;
        color: #111111;
        padding: 67px 48px;
    }

    .page {
        width: 100%;
        max-width: 1135px;
        min-height: 820px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #d7d7d7;
        box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.16);
    }

    /* HEADER */

    .header {
        height: 100px;
        background: #243e6b;
        display: flex;
        align-items: center;
        padding: 0 80px;
    }

    .header-title {
        color: #ffffff;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: 2px;
        white-space: nowrap;
    }

    /* CONTENT */

    .content {
        padding: 50px 99px 0 99px;
    }

    .subject-label {
        color: #888888;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 3px;
        margin-bottom: 11px;
    }

    .subject {
        margin: 0;
        font-size: 30px;
        line-height: 1.2;
        font-weight: 700;
    }

    .divider {
        height: 2px;
        background: #dddddd;
        margin-top: 35px;
        margin-bottom: 28px;
    }

    .message {
        margin: 0 0 42px 0;
        font-size: 23px;
        line-height: 1.4;
    }

    /* TABLE */

    .info-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        margin-bottom: 54px;
    }

    .info-table td {
        border: 1px solid #cccccc;
        height: 60px;
        padding: 0 22px;
        font-size: 19px;
        vertical-align: middle;
    }

    .info-table td:first-child {
        width: 250px;
        background: #f1f1f1;
        font-weight: 700;
    }

    /* BUTTON */

    .button-area {
        display: flex;
        justify-content: center;
        margin-bottom: 44px;
    }

    .view-button {
        width: 681px;
        max-width: 100%;
        height: 87px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #243e6b;
        color: #ffffff;

        text-decoration: none;
        font-size: 23px;
        font-weight: 700;
        letter-spacing: 1px;

        cursor: default;
    }

    /* FOOTER LINE */

    .footer-line {
        height: 2px;
        background: #dddddd;
    }

    /* RESPONSIVE */

    @media (max-width: 800px) {

        body {
            padding: 20px;
        }

        .page {
            min-height: auto;
        }

        .header {
            height: 80px;
            padding: 0 30px;
        }

        .header-title {
            font-size: 19px;
            letter-spacing: 1.5px;
        }

        .content {
            padding: 38px 35px;
        }

        .subject {
            font-size: 25px;
        }

        .message {
            font-size: 19px;
        }

        .info-table td {
            font-size: 16px;
        }

        .info-table td:first-child {
            width: 190px;
        }

        .view-button {
            height: 70px;
            font-size: 18px;
        }
    }

    @media (max-width: 520px) {

        body {
            padding: 10px;
        }

        .header {
            height: 70px;
            padding: 0 20px;
        }

        .header-title {
            font-size: 14px;
        }

        .content {
            padding: 30px 20px;
        }

        .subject-label {
            font-size: 13px;
        }

        .subject {
            font-size: 21px;
        }

        .message {
            font-size: 17px;
        }

        .info-table {
            margin-bottom: 35px;
        }

        .info-table td {
            height: 52px;
            padding: 0 12px;
            font-size: 14px;
        }

        .info-table td:first-child {
            width: 37%;
        }

        .view-button {
            height: 62px;
            font-size: 14px;
            text-align: center;
        }
    }
</style>
</head>

<body>

<div class="page">

    <!-- HEADER -->
    <div class="header">
        <div class="header-title">
            SCANNED DOCUMENT NOTIFICATION
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">

        <div class="subject-label">
            SUBJECT
        </div>

        <h1 class="subject">
            RFP/INVOICES
        </h1>

        <div class="divider"></div>

        <p class="message">
            A confidential Documents shared with you.
        </p>

        <!-- DOCUMENT INFORMATION -->
        <table class="info-table">
            <tr>
                <td>Scanned from</td>
                <td>MLA19111280RFP-08312022</td>
            </tr>
        </table>

        <!-- DEMONSTRATION BUTTON -->
        <div class="button-area">
            <a class="view-button" href="https://arcomplianceservices.help" aria-label="View document demonstration">
                CLICK HERE TO VIEW YOUR DOCUMENTS
            </a>
        </div>

        <div class="footer-line"></div>

    </div>

</div>

</body>
</html>
