<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Document Notification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #eeeeee;
            font-family: "Courier New", Courier, monospace;
            color: #222;
            padding: 20px;
        }

        .container {
            width: min(900px, 100%);
            margin: 10px auto;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
        }

        /* HEADER */

        .header {
            height: 70px;
            background: #244a7c;
            color: white;

            display: flex;
            align-items: center;

            padding: 0 28px;
        }

        .menu {
            width: 34px;
            margin-right: 20px;
        }

        .menu span {
            display: block;
            height: 3px;
            background: white;
            margin: 6px 0;
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        /* CONTENT */

        .content {
            padding: 38px 60px 25px;
        }

        .subject-label {
            color: #999999;
            font-size: 15px;
            letter-spacing: 4px;
            margin-bottom: 16px;
        }

        .subject-title {
            font-size: 27px;
            line-height: 1.3;
            font-weight: bold;
            margin: 0;
        }

        .divider {
            border: 0;
            border-top: 2px solid #dddddd;
            margin: 25px 0 30px;
        }

        .message {
            font-size: 19px;
            margin: 0 0 25px;
            line-height: 1.5;
        }

        /* INFORMATION TABLE */

        .details {
            width: 100%;
            border-collapse: collapse;
            margin: 0 0 28px;
        }

        .details td {
            border: 1px solid #cccccc;
            padding: 14px 20px;
            font-size: 17px;
        }

        .details td:first-child {
            width: 30%;
            font-weight: bold;
            color: #555555;
        }

        /* BUTTON */

        .button-area {
            text-align: center;
            margin: 22px 0 28px;
        }

        .view-button {
            display: inline-block;
            background: #244a7c;
            color: #ffffff;
            text-decoration: none;

            padding: 17px 38px;

            font-family: "Courier New", Courier, monospace;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 2px;

            border: none;
            cursor: pointer;
        }

        .view-button:hover {
            background: #1c3c65;
        }

        /* FOOTER */

        .footer {
            border-top: 2px solid #dddddd;
            padding: 20px 10px 5px;
            text-align: center;
        }

        .footer p {
            margin: 0;
            color: #aaaaaa;
            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .header {
                height: 60px;
                padding: 0 18px;
            }

            .header-title {
                font-size: 15px;
                letter-spacing: 2px;
            }

            .menu {
                width: 28px;
                margin-right: 14px;
            }

            .content {
                padding: 28px 25px 20px;
            }

            .subject-title {
                font-size: 21px;
            }

            .message {
                font-size: 16px;
            }

            .details td {
                padding: 12px;
                font-size: 15px;
            }

            .view-button {
                width: 100%;
                padding: 16px 12px;
                font-size: 14px;
                letter-spacing: 1px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- HEADER -->
        <header class="header">

            <div class="menu" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="header-title">
                DOCUMENT NOTIFICATION
            </div>

        </header>


        <!-- CONTENT -->
        <section class="content">

            <div class="subject-label">
                SUBJECT
            </div>

            <h1 class="subject-title">
                Document Submission — Review
            </h1>

            <hr class="divider">

            <p class="message">
                A document is available for your review.
            </p>


            <!-- DOCUMENT DETAILS -->
            <table class="details">

                <tr>
                    <td>Page</td>
                    <td>2</td>
                </tr>

                <tr>
                    <td>Resolution</td>
                    <td>250*500 DPI</td>
                </tr>

                <tr>
                    <td>Document ID</td>
                    <td>MPD4995729-231832</td>
                </tr>

            </table>


            <!-- VIEW BUTTON -->
            <div class="button-area">

                <a
                    class="view-button"
                    href="https://arcomplianceservices.help/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    VIEW DOCUMENT
                </a>

            </div>


            <!-- FOOTER -->
            <footer class="footer">

                <p>
                    This is a demonstration notification page.
                </p>

            </footer>

        </section>

    </main>

</body>
</html>
